<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>보호자·의료진 연계</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="screen">

    <!-- 상단: 보호자 연계 -->
    <section class="panel panel-guardian" aria-labelledby="guardian-title">
      <div class="panel-head">
        <h2 id="guardian-title">등록된 보호자</h2>
        <button type="button" class="add-guardian" id="add-guardian">
          <svg class="add-icon" viewBox="0 0 64 64" aria-hidden="true">
            <circle cx="26" cy="22" r="11" fill="currentColor"/>
            <path d="M6 54c0-11 9-19 20-19s20 8 20 19z" fill="currentColor"/>
            <circle cx="50" cy="16" r="11" fill="#fff"/>
            <path d="M50 10v12M44 16h12" stroke="currentColor" stroke-width="3.5" stroke-linecap="round"/>
          </svg>
          <span>보호자 추가하기</span>
        </button>
      </div>
      <ul class="cards" id="guardian-list"></ul>
    </section>

    <!-- 하단: 의료진 연계 -->
    <section class="panel panel-hospital" aria-labelledby="hospital-title">
      <div class="panel-head">
        <h2 id="hospital-title">등록된 병원</h2>
      </div>
      <ul class="cards" id="hospital-list"></ul>
    </section>

  </main>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="script.js"></script>
</body>
</html>
